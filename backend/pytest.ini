[pytest]
asyncio_mode = auto
# The SQLAlchemy engines (app.db.engine and the test engine) are module-level
# singletons, so their asyncpg connection pools bind to whichever event loop
# first used them. Running every test and fixture on one session-wide loop
# keeps those pools valid for the whole run; per-test loops would leave
# connections attached to a closed loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
