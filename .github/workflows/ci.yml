name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seatrush
          POSTGRES_PASSWORD: seatrush
          POSTGRES_DB: seatrush_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seatrush"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://seatrush:seatrush@localhost:5432/seatrush_test
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app
      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy app --ignore-missing-imports || true
      - name: Run migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
