name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seatrush
          POSTGRES_PASSWORD: seatrush
          POSTGRES_DB: seatrush_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seatrush"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://seatrush:seatrush@localhost:5432/seatrush_test
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app
      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy app --ignore-missing-imports || true
      - name: Run migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # The Playwright specs drive the real stack (API + workers + Redis +
  # seeded Postgres), so they get their own job rather than riding along
  # with the static frontend checks.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seatrush
          POSTGRES_PASSWORD: seatrush
          POSTGRES_DB: seatrush
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seatrush"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://seatrush:seatrush@localhost:5432/seatrush
      REDIS_URL: redis://localhost:6379/0
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start backend, workers and seed data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m scripts.seed
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          nohup python -m app.workers.run_workers &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/readyz && break; sleep 2; done
      - name: Run Playwright specs
        working-directory: frontend
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npm run test:e2e
